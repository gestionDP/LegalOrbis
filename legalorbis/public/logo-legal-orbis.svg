<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for the O -->
  <defs>
    <linearGradient id="orbisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eb4d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5f5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- LEGAL text -->
  <text x="10" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">LEGAL</text>
  
  <!-- ORBIS circle (O) -->
  <circle cx="85" cy="20" r="15" fill="url(#orbisGradient)" />
  <circle cx="85" cy="20" r="12" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- RBIS text -->
  <text x="105" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a5f5f">RBIS</text>
  
  <!-- ABOGADOS text -->
  <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5f5f">ABOGADOS</text>
</svg>
